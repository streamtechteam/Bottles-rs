name: Vendor Rust crates (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        working-directory: rust
        run: cargo fmt --all
      - name: Generate lockfile and vendor dependencies
        working-directory: rust
        run: |
          cargo generate-lockfile
          cargo vendor --versioned-dirs vendor > /tmp/vendor-config.toml
          tar -czf vendor-bundle.tar.gz vendor Cargo.lock
      - name: Commit a single offline dependency bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock rust/crates rust/contracts rust/scripts rust/README.md rust/PARITY.md
          git add -f rust/vendor-bundle.tar.gz
          git commit -m "chore: cache vendored Rust crates [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
