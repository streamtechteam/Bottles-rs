name: Rust rewrite CI and build

on:
  push:
    branches:
      - arena/55ea25b9-bottles-rs
    paths:
      - "rust/**"
      - "bottles/backend/models/config.py"
      - "bottles/frontend/cli/cli.py"
      - "bottles/frontend/ui/**"
      - "data/com.usebottles.bottles.gschema.xml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "bottles/backend/models/config.py"
      - "bottles/frontend/cli/cli.py"
      - "bottles/frontend/ui/**"
      - "data/com.usebottles.bottles.gschema.xml"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libudev-dev \
            python3-yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify generated contracts
        run: |
          python3 rust/scripts/generate_contracts.py --check
          python3 rust/scripts/generate_parity_report.py --check
      - name: Verify GUI catalogs
        run: python3 rust/scripts/generate_gui_catalogs.py --check
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets
      - name: Workspace tests
        working-directory: rust
        run: cargo test --locked --workspace
      - name: Check egui application
        working-directory: rust
        run: cargo check --locked -p bottles-gui --all-targets
      - name: Build release binaries
        working-directory: rust
        run: cargo build --locked --release --workspace
      - name: Package Linux binaries
        run: |
          mkdir -p dist
          tar -czf dist/bottles-rs-linux-x86_64.tar.gz \
            -C rust/target/release bottles bottles-cli
          sha256sum dist/bottles-rs-linux-x86_64.tar.gz \
            > dist/bottles-rs-linux-x86_64.tar.gz.sha256
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bottles-rs-linux-x86_64
          path: |
            dist/bottles-rs-linux-x86_64.tar.gz
            dist/bottles-rs-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
