[workspace]
resolver = "2"
members = [
    "crates/bottles-core",
    "crates/bottles-cli",
    "crates/bottles-gui",
]

[workspace.package]
version = "67.4.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/streamtechteam/Bottles-rs"
authors = ["Bottles Rust port"]

[workspace.dependencies]
bottles-core = { path = "crates/bottles-core" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5.48", features = ["derive"] }
eframe = { version = "0.31.1", features = ["default_fonts", "glow", "x11", "wayland"] }
env_logger = "0.11.8"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
