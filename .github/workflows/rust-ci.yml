name: Rust rewrite CI

on:
  push:
    branches:
      - arena/55ea25b9-bottles-rs
    paths:
      - "rust/**"
      - "bottles/backend/models/config.py"
      - "bottles/frontend/cli/cli.py"
      - "bottles/frontend/ui/**"
      - "data/com.usebottles.bottles.gschema.xml"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "bottles/backend/models/config.py"
      - "bottles/frontend/cli/cli.py"
      - "bottles/frontend/ui/**"
      - "data/com.usebottles.bottles.gschema.xml"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-vendor:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and bundle dependencies
        working-directory: rust
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo vendor --versioned-dirs vendor > /tmp/vendor-config.toml
          tar -czf vendor-bundle.tar.gz vendor Cargo.lock
      - name: Commit generated formatting and offline bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock rust/crates rust/contracts rust/scripts rust/README.md rust/PARITY.md
          git add -f rust/vendor-bundle.tar.gz
          if git diff --cached --quiet; then
            echo "No formatting or dependency changes"
          else
            git commit -m "chore: format Rust sources and cache vendored crates [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Verify generated contracts
        run: |
          python3 rust/scripts/generate_contracts.py --check
          python3 rust/scripts/generate_parity_report.py --check
      - name: Format
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets
      - name: Core and CLI tests
        working-directory: rust
        run: cargo test -p bottles-core -p bottles-cli
      - name: Check egui application
        working-directory: rust
        run: cargo check -p bottles-gui --all-targets
